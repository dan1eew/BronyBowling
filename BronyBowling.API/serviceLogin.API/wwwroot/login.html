<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Вход</h2>

        <input id="phone" placeholder="Телефон (11 цифр)">
        <input id="password" type="password" placeholder="Пароль">

        <button onclick="login()">Войти</button>
        <button onclick="location.href='index.html'">Назад</button>

        <div id="status"></div>
    </div>

    <script src="app.js"></script>
    <script>async function login() {
  try {
    const r = await fetch(AUTH_API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phoneNumber: phone.value,
        password: password.value
      })
    });

    if (!r.ok) throw new Error("Ошибка входа");

    const data = await r.json();
    saveToken(data.token);

    showStatus("Успешный вход ✅", true);
  } catch (e) {
    showStatus(e.message);
  }
}</script>
</body>
</html>
