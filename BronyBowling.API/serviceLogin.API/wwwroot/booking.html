<script>
    const BOOKING_API = "http://localhost:5280";
    const token = localStorage.getItem("jwt");

    async function searchLanes() {
        const date = document.getElementById("date").value;
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;

        if (!date || !start || !end) {
            alert("Выберите дату и время");
            return;
        }

        const startTime = date + "T" + start;
        const endTime = date + "T" + end;

        const r = await fetch(`${BOOKING_API}/lanes/available?start=${startTime}&end=${endTime}`);
        const lanes = await r.json();

        lane.innerHTML = "";

        lanes.forEach(l => {
            const o = document.createElement("option");
            o.value = l.bowlingLaneId;
            o.text = "Дорожка №" + l.number;
            lane.appendChild(o);
        });
    }

    async function book() {
        const date = document.getElementById("date").value;
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;

        const body = {
            bowlingLaneId: parseInt(lane.value),
            startTime: date + "T" + start,
            endTime: date + "T" + end,
            guestName: document.getElementById("guestName").value || null,
            guestPhone: document.getElementById("guestPhone").value || null
        };

        const r = await fetch(`${BOOKING_API}/bookings`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...(token ? { "Authorization": "Bearer " + token } : {})
            },
            body: JSON.stringify(body)
        });

        if (!r.ok) {
            result.innerText = await r.text();
            return;
        }

        const booking = await r.json();

        localStorage.setItem("booking", JSON.stringify(booking));
        location.href = "payment.html";
    }
</script>
