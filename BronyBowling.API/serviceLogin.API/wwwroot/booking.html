<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бронирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Brony Bowling</h1>
        <nav>
            <button onclick="location.href='index.html'">Главная</button>
            <button onclick="logout()">Выйти</button>
        </nav>
    </header>

    <div class="container">
        <h3>Бронирование</h3>

        <input id="date" type="date">
        <input id="start" type="time">
        <input id="end" type="time">

        <button onclick="search()">Найти дорожки</button>

        <div id="lanesContainer" class="lanes"></div>

        <div id="guestFields" style="display:none">
            <input id="guestName" placeholder="ФИО">
            <input id="guestPhone" placeholder="Телефон">
        </div>

        <button onclick="book()">Забронировать</button>

        <div id="status"></div>
    </div>

    <script src="app.js"></script>
    <script>
        const lanesContainer = document.getElementById("lanesContainer");
        const guestFields = document.getElementById("guestFields");
        const date = document.getElementById("date");
        const start = document.getElementById("start");
        const end = document.getElementById("end");
        const guestName = document.getElementById("guestName");
        const guestPhone = document.getElementById("guestPhone");

        let selectedLaneId = null;

        if (!getToken()) guestFields.style.display = "block";

        function toUtcIso(dateStr, timeStr) {
            const local = new Date(`${dateStr}T${timeStr}:00`);
            return local.toISOString();
        }

        async function search() {
            if (!date.value || !start.value || !end.value) {
                showStatus("Заполните дату и время", true);
                return;
            }

            selectedLaneId = null;
            lanesContainer.innerHTML = "Загрузка...";

            const startTime = toUtcIso(date.value, start.value);
            const endTime = toUtcIso(date.value, end.value);

            const r = await fetch(`${BOOKING_API}/lanes/available?start=${startTime}&end=${endTime}`);

            if (!r.ok) {
                lanesContainer.innerHTML = "";
                showStatus("Ошибка загрузки дорожек", true);
                return;
            }

            const lanes = await r.json();
            console.log(lanes);

            lanesContainer.innerHTML = "";

            if (!lanes.length) {
                lanesContainer.innerHTML = "<div class='lane-meta'>Нет свободных дорожек</div>";
                return;
            }

            lanes.forEach(l => {
                const div = document.createElement("div");
                div.className = "lane-item";
                div.dataset.id = l.laneId;

                div.innerHTML = `
                        <div class="lane-number">Дорожка №${l.number}</div>
                        <div class="lane-meta">Свободна</div>
                    `;

                div.onclick = () => selectLane(div, l.laneId);
                lanesContainer.appendChild(div);
            });
        }

        function selectLane(element, laneId) {
            document.querySelectorAll(".lane-item").forEach(e => e.classList.remove("selected"));
            element.classList.add("selected");
            selectedLaneId = laneId;
            console.log("Выбрана дорожка:", laneId);
        }

        async function book() {
            if (!selectedLaneId) {
                showStatus("Выберите дорожку", true);
                return;
            }

            const body = {
                bowlingLaneId: selectedLaneId,
                startTime: toUtcIso(date.value, start.value),
                endTime: toUtcIso(date.value, end.value),
                guestFullName: getToken() ? null : guestName.value,
                guestPhone: getToken() ? null : guestPhone.value
            };

            const r = await fetch(`${BOOKING_API}/bookings`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    ...authHeader()
                },
                body: JSON.stringify(body)
            });

            if (!r.ok) {
                const text = await r.text();
                console.error(text);

                try {
                    const err = JSON.parse(text);
                    showStatus(err.errors?.join("\n") ?? err, true);
                } catch {
                    showStatus("Ошибка сервера", true);
                }
                return;
            }

            const booking = await r.json();
            localStorage.setItem("booking", JSON.stringify(booking));

            showStatus("Бронь создана");
            location.href = "payment.html";
        }
    </script>
</body>
</html>
