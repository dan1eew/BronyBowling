<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бронирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h3>Бронирование</h3>

        <label>Дата:</label>
        <input id="date" type="date">

        <label>Время начала:</label>
        <input id="start" type="time">

        <label>Время окончания:</label>
        <input id="end" type="time">

        <button onclick="search()">Найти дорожки</button>

        <div id="lanesContainer" class="lanes-grid"></div>

        <div id="guestFields" style="display:none">
            <input id="guestName" placeholder="ФИО">
            <input id="guestPhone" placeholder="Телефон">
        </div>

        <button onclick="book()">Забронировать</button>

        <div id="status"></div>
    </div>

    <script src="app.js"></script>
    <script>
        const lanesContainer = document.getElementById("lanesContainer");
        const guestFields = document.getElementById("guestFields");
        let selectedLane = null;
        let selectedCenterId = null;

        if (!getToken()) guestFields.style.display = "block";

        async function search() {
            if (!date.value || !start.value || !end.value) {
                showStatus("Выберите дату и время", true);
                return;
            }

            const startTime = `${date.value}T${start.value}:00`;
            const endTime = `${date.value}T${end.value}:00`;

            lanesContainer.innerHTML = "Загрузка...";
            selectedLane = null;
            selectedCenterId = null;

            // Предполагаем, что API принимает centerId как query param
            const r = await fetch(`${BOOKING_API}/lanes/available?start=${startTime}&end=${endTime}`);
            if (!r.ok) {
                showStatus("Ошибка загрузки дорожек", true);
                lanesContainer.innerHTML = "";
                return;
            }

            const lanes = await r.json();

            if (!lanes.length) {
                lanesContainer.innerHTML = "<p>Нет свободных дорожек</p>";
                return;
            }

            lanesContainer.innerHTML = "";

            lanes.forEach(l => {
                const card = document.createElement("div");
                card.className = "lane-card";
                card.innerHTML = `
                        <div class="lane-number">№${l.laneNumber}</div>
                        <div class="lane-center">${l.centerName}</div>
                        <div class="lane-status">Свободна</div>
                    `;

                card.onclick = () => selectLane(l.centerId, l.laneNumber, card);

                lanesContainer.appendChild(card);
            });
        }

        function selectLane(centerId, laneNumber, element) {
            document.querySelectorAll(".lane-card")
                .forEach(c => c.classList.remove("selected"));

            element.classList.add("selected");
            selectedLane = laneNumber;
            selectedCenterId = centerId;
        }

        async function book() {
            if (!selectedLane || !selectedCenterId) {
                showStatus("Выберите дорожку", true);
                return;
            }

            if (!date.value || !start.value || !end.value) {
                showStatus("Выберите дату и время", true);
                return;
            }

            const body = {
                centerId: selectedCenterId,
                laneNumber: selectedLane,
                startTime: `${date.value}T${start.value}:00`,
                endTime: `${date.value}T${end.value}:00`,
                guestName: getToken() ? null : guestName.value,
                guestPhone: getToken() ? null : guestPhone.value
            };

            const r = await fetch(`${BOOKING_API}/bookings`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    ...authHeader()
                },
                body: JSON.stringify(body)
            });

            if (!r.ok) {
                const err = await r.json();
                showStatus(err.errors?.join("\n") || "Ошибка бронирования", true);
                return;
            }

            const booking = await r.json();
            localStorage.setItem("booking", JSON.stringify(booking));

            showStatus("Бронь создана");
            location.href = "payment.html";
        }
    </script>

</body>
</html>
