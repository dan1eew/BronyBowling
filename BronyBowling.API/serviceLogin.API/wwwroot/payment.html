<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h3>Оплата</h3>
        <div id="info"></div>
        <button onclick="pay()">Оплатить</button>
    </div>

    <script src="app.js"></script>
    <script>const booking = JSON.parse(localStorage.getItem("booking"));

if (!booking) location.href = "booking.html";

const start = new Date(booking.startTime);
const end = new Date(booking.endTime);
const hours = (end - start) / 1000 / 60 / 60;
const price = hours * 600;

info.innerHTML = `
  <p>Дорожка: ${booking.bowlingLaneId}</p>
  <p>Начало: ${booking.startTime}</p>
  <p>Конец: ${booking.endTime}</p>
  <p>Сумма: ${price} ₽</p>
`;

function pay() {
  alert("Тестовая оплата успешна");
}</script>

</body>
</html>
