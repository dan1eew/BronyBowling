<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>

    <h2>Регистрация</h2>

    <input id="phone" placeholder="Телефон"><br>
    <input id="password" type="password" placeholder="Пароль"><br>
    <input id="lastName" placeholder="Фамилия"><br>
    <input id="firstName" placeholder="Имя"><br>
    <input id="middleName" placeholder="Отчество (необязательно)"><br>
    <input id="birthDate" type="date"><br>
    <input id="city" placeholder="Город"><br>

    <button onclick="register()">Зарегистрироваться</button>

    <script>
        async function register() {

            const phoneInput = document.getElementById("phone");
            const passwordInput = document.getElementById("password");
            const firstNameInput = document.getElementById("firstName");
            const lastNameInput = document.getElementById("lastName");
            const middleNameInput = document.getElementById("middleName");
            const birthDateInput = document.getElementById("birthDate");
            const cityInput = document.getElementById("city");

            const phone = phoneInput.value.trim();
            const password = passwordInput.value.trim();
            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const middleName = middleNameInput.value.trim();
            const birthDate = birthDateInput.value;
            const city = cityInput.value.trim();

            const response = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    phoneNumber: phone,
                    password,
                    firstName,
                    lastName,
                    middleName: middleName || null,
                    birthDate: birthDate || null,
                    city: city || null
                })
            });

            if (!response.ok) {
                const error = await response.text();
                alert(error);
                return;
            }

            alert("Регистрация успешна!");
        }
    </script>

</body>
</html>
