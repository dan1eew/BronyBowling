<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h3>Регистрация</h3>

        <input id="phone" placeholder="Телефон (11 цифр)">
        <input id="password" type="password" placeholder="Пароль">
        <input id="lastName" placeholder="Фамилия">
        <input id="firstName" placeholder="Имя">
        <input id="middleName" placeholder="Отчество (необязательно)">

        <button onclick="register()">Создать аккаунт</button>

        <div id="status"></div>
    </div>

    <script src="app.js"></script>
    <script>
        async function register() {
            const data = {
                phoneNumber: phone.value,
                password: password.value,
                firstName: firstName.value,
                lastName: lastName.value,
                middleName: middleName.value || null
            };

            const r = await fetch(`${AUTH_API}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (!r.ok) {
                const err = await r.json();
                showStatus(err.errors.join("\n"), true);
                return;
            }

            showStatus("Регистрация успешна");
        }
    </script>

</body>
</html>
