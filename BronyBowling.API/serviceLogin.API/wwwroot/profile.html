<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h3>Профиль</h3>

        <input id="firstName" placeholder="Имя">
        <input id="lastName" placeholder="Фамилия">

        <button onclick="loadProfile()">Загрузить</button>
        <button onclick="saveProfile()">Сохранить</button>
        <button onclick="deleteProfile()">Удалить профиль</button>

        <div id="status"></div>
    </div>

    <script src="app.js"></script>
    <script>

        document.addEventListener("DOMContentLoaded", () => {
            if (!getToken()) {
                location.href = "login.html";
                return;
            }

            loadProfile();
        });

        async function loadProfile() {
            showStatus("Загрузка профиля...");
            toggleButtons(true);

            try {
                const r = await fetch(`${PROFILE_API}/profile`, {
                    headers: authHeader()
                });

                if (r.status === 401) {
                    showStatus("Сессия истекла", true);
                    logout();
                    return;
                }

                if (!r.ok) {
                    showStatus("Ошибка загрузки профиля", true);
                    return;
                }

                const p = await r.json();

                firstName.value = p.firstName ?? "";
                lastName.value = p.lastName ?? "";

                showStatus("Профиль загружен");
            }
            catch {
                showStatus("Сервер недоступен", true);
            }
            finally {
                toggleButtons(false);
            }
        }

        async function saveProfile() {
            const r = await fetch(`${PROFILE_API}/profile`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    ...authHeader()
                },
                body: JSON.stringify({
                    firstName: firstName.value,
                    lastName: lastName.value
                })
            });

            if (!r.ok) {
                const err = await r.json();
                showStatus(err.errors.join("\n"), true);
                return;
            }

            showStatus("Профиль обновлён");
        }

        async function deleteProfile() {
            const r = await fetch(`${PROFILE_API}/profile`, {
                method: "DELETE",
                headers: authHeader()
            });

            if (!r.ok) {
                showStatus("Ошибка удаления", true);
                return;
            }

            logout();
        }
    </script>
</body>
</html>
