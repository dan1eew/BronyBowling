<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
</head>
<body>
    <h2>Профиль</h2>

    <div id="profile"></div>

    <h3>Редактирование</h3>
    <input id="fullname" placeholder="ФИО"><br><br>
    <input id="birthdate" type="date"><br><br>
    <input id="city" placeholder="Город"><br><br>

    <button onclick="updateProfile()">Сохранить</button>
    <button onclick="deleteProfile()">Удалить профиль</button>

    <script>const token = localStorage.getItem("token");

        if (!token) {
            alert("Нет авторизации");
            window.location.href = "login.html";
        }

        async function loadProfile() {
            const response = await fetch("https://localhost:7002/profile", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                alert("Ошибка загрузки профиля");
                return;
            }

            const data = await response.json();

            document.getElementById("profile").innerText =
                `Телефон: ${data.phoneNumber}
ФИО: ${data.fullName}
Дата рождения: ${data.birthDate}
Город: ${data.city ?? ""}`;

            document.getElementById("fullname").value = data.fullName;
            document.getElementById("birthdate").value = data.birthDate.substring(0, 10);
            document.getElementById("city").value = data.city ?? "";
        }

        async function updateProfile() {
            await fetch("https://localhost:7002/profile", {
                method: "PUT",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fullName: fullname.value,
                    birthDate: birthdate.value,
                    city: city.value
                })
            });

            alert("Обновлено");
            loadProfile();
        }

        async function deleteProfile() {
            await fetch("https://localhost:7002/profile", {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            localStorage.removeItem("token");
            alert("Профиль удалён");
            window.location.href = "login.html";
        }

        loadProfile();</script>
</body>
</html>
