<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h2>Вход</h2>

    <input id="phone" placeholder="Телефон"><br><br>
    <input id="password" type="password" placeholder="Пароль"><br><br>

    <button onclick="login()">Войти</button>

    <script>async function login() {
            const response = await fetch("https://localhost:7001/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phoneNumber: document.getElementById("phone").value,
                    password: document.getElementById("password").value
                })
            });

            if (!response.ok) {
                alert("Ошибка входа");
                return;
            }

            const data = await response.json();

            // сохраняем JWT
            localStorage.setItem("token", data.token);

            // переход в профиль
            window.location.href = "profile.html";
        }</script>
</body>
</html>
